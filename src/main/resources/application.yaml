spring:
  application:
    name: class-registration

  datasource:
    url: jdbc:postgresql://localhost:5432/classdb
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  devtools:
    restart:
      enabled: true

server:
  port: 8080

enrollment:
  cancel-period-hours: 24  # 수강 취소 가능 기간 (신청 후 N시간 이내)

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
